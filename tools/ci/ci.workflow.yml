# OVERDUB continuous integration. What runs and how to reproduce it locally: docs/CI.md.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same PR / branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prototype:
    name: prototype (tsc + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototype
    env:
      # playwright is a devDependency for scripts/smoke.mjs only; the vitest suite needs no browser.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Tracked file sizes
        working-directory: .
        run: bash tools/ci/check_large_files.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

  godot:
    name: godot (import + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.4.1-stable
      # SHA-512 of Godot_v4.4.1-stable_linux.x86_64.zip, from the release's SHA512-SUMS.txt.
      # tools/ci/fetch_godot.sh checks the download against both this pin and the checksum file.
      GODOT_SHA512: ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e
      GODOT_TIMEOUT: "900"
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-ci/${{ env.GODOT_VERSION }}
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-${{ env.GODOT_SHA512 }}

      - name: Fetch and verify Godot
        run: |
          bin="$(bash tools/ci/fetch_godot.sh "$HOME/.cache/godot-ci/$GODOT_VERSION")"
          echo "GODOT=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Import + tests
        env:
          CI_LOG_DIR: ${{ runner.temp }}/godot-ci-logs
        run: bash tools/ci/godot_tests.sh

      - name: Upload Godot logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: ${{ runner.temp }}/godot-ci-logs
          if-no-files-found: ignore
          retention-days: 7
