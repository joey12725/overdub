<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>OVERDUB</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0a10;
        color: #f2eee6;
      }
      #overdub {
        position: fixed;
        inset: 0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #overdub > canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="overdub"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
