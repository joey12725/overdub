<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OVERDUB render harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        color: #eee;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #stage canvas {
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        left: 12px;
        top: 10px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 6px;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
