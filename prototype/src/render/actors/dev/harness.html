<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Actor Harness</title>
    <style>
      :root {
        --bg: #17141c;
        --fg: #f1eadc;
        --muted: #a49ca8;
        --accent: #ffc414;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.3 system-ui, 'Segoe UI', Arial, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #bar {
        position: fixed;
        top: 8px;
        left: 8px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        z-index: 2;
      }
      #bar button {
        background: #2a2530;
        color: var(--fg);
        border: 1px solid #4a4250;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      #bar button.on {
        border-color: var(--accent);
        color: var(--accent);
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }
      .lbl {
        position: absolute;
        transform: translate(-50%, 0);
        padding: 1px 6px;
        border-radius: 3px;
        background: rgba(15, 12, 18, 0.72);
        color: var(--fg);
        font-size: 11px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <div id="labels"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
