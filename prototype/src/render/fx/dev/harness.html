<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OVERDUB fx harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120e16;
        color: #f3ead8;
        font: 13px/1.3 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 760px;
        z-index: 2;
      }
      #panel button,
      #panel select {
        background: rgba(20, 17, 15, 0.86);
        color: inherit;
        border: 1px solid rgba(243, 234, 216, 0.25);
        border-radius: 6px;
        padding: 4px 8px;
        font: inherit;
        cursor: pointer;
      }
      #panel button.on {
        border-color: #ffd23f;
        color: #ffd23f;
      }
      #status {
        position: fixed;
        bottom: 8px;
        left: 8px;
        z-index: 2;
        opacity: 0.8;
        font-family: Consolas, monospace;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="panel"></div>
    <div id="status"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
