<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HUD Harness</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; overflow: hidden; }
      /* Stand-in playfields: a warm sunlit upper level and a dark neon lower level, to check contrast. */
      body[data-bg='warm'] #stage {
        background:
          repeating-linear-gradient(30deg, rgba(120, 90, 50, 0.18) 0 2px, transparent 2px 46px),
          repeating-linear-gradient(-30deg, rgba(120, 90, 50, 0.18) 0 2px, transparent 2px 46px),
          radial-gradient(ellipse at 45% 40%, #f1d9a8 0%, #d9b57e 45%, #8f7a52 100%);
      }
      body[data-bg='dark'] #stage {
        background:
          repeating-linear-gradient(30deg, rgba(255, 79, 163, 0.16) 0 2px, transparent 2px 46px),
          repeating-linear-gradient(-30deg, rgba(79, 243, 255, 0.12) 0 2px, transparent 2px 46px),
          radial-gradient(ellipse at 45% 40%, #2b1a45 0%, #120c1f 60%, #07050c 100%);
      }
      #controls { position: fixed; top: 4px; right: 4px; z-index: 99; display: flex; flex-wrap: wrap; gap: 3px; max-width: 46vw; justify-content: flex-end; opacity: 0.25; }
      #controls:hover { opacity: 1; }
      #controls button { font: 11px system-ui; padding: 2px 6px; border: 1px solid #555; background: #222; color: #ddd; border-radius: 3px; cursor: pointer; }
      #controls button.on { background: #ffd23f; color: #111; }
      #log { position: fixed; right: 6px; top: 64px; z-index: 99; margin: 0; font: 11px monospace; color: #ffd23f; white-space: pre; pointer-events: none; text-shadow: 0 1px 0 #000; }
      body.shot #controls, body.shot #log { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="controls"></div>
    <pre id="log"></pre>
    <script type="module" src="./harness.ts"></script>
    <script>
      if (new URLSearchParams(location.search).has('shot')) document.body.classList.add('shot');
    </script>
  </body>
</html>
